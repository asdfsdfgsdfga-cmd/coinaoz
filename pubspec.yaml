name: coinaozx_fs
description: "Local-first trading calculators for average cost, take-profit/stop-loss, profit/loss and position sizing across stocks, crypto and tokens."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
